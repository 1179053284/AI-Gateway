  <div class="main-col">
    <!-- 顶栏（参考 :477-522：60px px-3 border-b · 面包屑 12px + 标题 15px · 右侧用户块） -->
    <header class="topbar">
      <div class="tb-left">
        <div class="crumb">

    <!-- 内容区（参考 :524-569：bg#fbfcfc · 左子侧栏 248px + 右滚动区 p-3，本页内容 max-w-980 居中） -->

      <!-- 子侧栏：供应商列表（参考 ProviderList :590-671） -->

                <div style="display:flex;height:28px;align-items:center;gap:8px;padding:0 4px;margin-bottom:6px">

                </span>
                <span style="min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Bigmodel</span>
                <span class="dot"></span>
              </button>
              <button class="anchor-item" data-provider="moonshot" style="display:flex;width:100%">
                <span class="mark-sm"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="8" x="2" y="2" rx="2" ry="2"/><rect width="20" height="8" x="2" y="14" rx="2" ry="2"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/></svg></span>
                <span style="min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Moonshot</span>
                <span class="dot"></span>
              </button>
              <button class="anchor-item" data-provider="minimax" style="display:flex;width:100%">
                <span class="mark-sm"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="8" x="2" y="2" rx="2" ry="2"/><rect width="20" height="8" x="2" y="14" rx="2" ry="2"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/></svg></span>
                <span style="min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">MiniMax</span>
                <span class="dot"></span>
              </button>
              <button class="anchor-item" data-provider="deepseek" style="display:flex;width:100%">
                <span class="mark-sm"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="8" x="2" y="2" rx="2" ry="2"/><rect width="20" height="8" x="2" y="14" rx="2" ry="2"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/></svg></span>
                <span style="min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">DeepSeek</span>
                <span class="dot"></span>

              <button class="anchor-item" data-provider="mimo" style="display:flex;width:100%">
                <span class="mark-sm"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="8" x="2" y="2" rx="2" ry="2"/><rect width="20" height="8" x="2" y="14" rx="2" ry="2"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/></svg></span>
                <span style="min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">MiMo</span>
                <span class="dot"></span>
              </button>
              <button class="anchor-item" data-provider="qwen" style="display:flex;width:100%">
                <span class="mark-sm"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="8" x="2" y="2" rx="2" ry="2"/><rect width="20" height="8" x="2" y="14" rx="2" ry="2"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/></svg></span>
                <span style="min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Qwen</span>
                <span class="dot"></span>
              </button>
            </div>
          </div>
          <!-- 分组：自定义供应商 -->
          <div style="margin-bottom:20px">
            <div class="nav-group-title" style="padding:0">自定义供应商</div>
            <div>
              <button class="anchor-item" data-provider="openrouter" style="display:flex;width:100%">
                <span class="mark-sm"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="8" x="2" y="2" rx="2" ry="2"/><rect width="20" height="8" x="2" y="14" rx="2" ry="2"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/></svg></span>

              </button>
              <button class="anchor-item" data-provider="openai-compatible" style="display:flex;width:100%">
                <span class="mark-sm"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="8" x="2" y="2" rx="2" ry="2"/><rect width="20" height="8" x="2" y="14" rx="2" ry="2"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/></svg></span>

              </button>
              <button class="anchor-item" data-provider="local-gateway" style="display:flex;width:100%">
                <span class="mark-sm"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="8" x="2" y="2" rx="2" ry="2"/><rect width="20" height="8" x="2" y="14" rx="2" ry="2"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/></svg></span>

        </div>
        <div class="subnav-foot">

      <!-- 主内容（参考 :536-537：p-3 · mx-auto max-w-[980px]） -->
      <main class="content" style="flex:1">
        <div style="max-width:980px;margin:0 auto;width:100%">

          <!-- 面板 A：编程套餐（参考 PackageConnectionPanel :829-876） -->
          <section id="panel-package">
            <div class="card" style="display:flex;align-items:center;justify-content:space-between;gap:12px">
              <div style="display:flex;min-width:0;align-items:center;gap:12px">
                <span class="logo-block dark">Z</span>
                <div style="min-width:0">
                  <div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px;font-weight:800;letter-spacing:-.02em;color:var(--text)">Z.AI - 编程套餐</div>
                  <div style="margin-top:4px;font-size:12px;font-weight:600;color:var(--text-faint)">未登录，登录后显示已订阅套餐包</div>
                </div>
              </div>
              <button class="btn btn-primary" id="login-zai" style="flex:none">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m10 17 5-5-5-5"/><path d="M15 12H3"/><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/></svg>
                登录 Z.AI
              </button>
            </div>

            <div style="margin-top:12px;display:flex;flex-direction:column;gap:12px">
              <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
                <div style="font-size:13px;font-weight:800;color:var(--text-soft)">编程套餐</div>
                <div class="pill-tabs">
                  <button class="pill-tab">月付</button>
                  <button class="pill-tab active">季付</button>
                  <button class="pill-tab">年付</button>
                </div>
              </div>
              <section class="card">
                <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px">
                  <div>
                    <div style="font-size:16px;font-weight:800;letter-spacing:-.02em;color:var(--text)">GLM Coding Lite</div>
                    <p class="clamp-2" style="margin-top:8px;max-width:560px;font-size:13px;font-weight:500;line-height:20px;color:var(--text-tertiary)">
                      登录 Z.AI 后，这里显示当前账号已订阅的编程套餐、额度、到期时间和可用模型。</p>
                    <div style="margin-top:12px;font-size:18px;font-weight:800;color:var(--text)">$48.60 美元</div>
                  </div>
                  <button class="btn btn-primary" id="subscribe" style="flex:none">订阅</button>
                </div>
              </section>
            </div>
          </section>

          <!-- 面板 B：API Key 配置（参考 ApiConfigPanel :878-998） -->
          <section id="panel-api" class="hidden">
            <!-- 头卡（参考 ApiProviderHeader :792-827） -->
            <div class="card" style="display:flex;align-items:center;justify-content:space-between;gap:12px">
              <div style="display:flex;min-width:0;align-items:center;gap:12px">
                <span class="logo-block dark">Z</span>
                <div style="min-width:0">
                  <div style="display:flex;min-width:0;align-items:center;gap:6px">
                    <button class="edit-name" data-edit title="点击编辑供应商名称">Z.AI</button>
                    <button class="icon-btn sm" data-edit-trigger aria-label="编辑供应商名称">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
                    </button>
                  </div>
                  <div style="margin-top:4px;font-size:12px;font-weight:600;color:var(--text-faint)">API Key 配置</div>
                </div>
              </div>
              <div style="display:flex;flex:none;align-items:center;gap:8px">
                <button class="btn" id="toggle-provider">禁用</button>
                <!-- 仅自定义供应商显示删除（参考 :816-824）：
                <button class="icon-btn lg danger" aria-label="删除供应商">
                  <svg …trash2…/><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>

              <!-- 卡 2：模型列表（参考 :930-950 · 行 h-46 px-4 · SectionLabel + Mock 药丸） -->

                  <div>
                    <div style="font-size:13px;font-weight:800;color:var(--text-soft)">模型列表</div>

                  <span class="badge b-ok b-pill" style="flex:none">
                    <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="#16d76d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
                    Mock
                  </span>
                </div>
                <div class="list-card" id="model-list">
                  <div class="list-row" style="height:46px;padding:0 16px">

<div id="toast-wrap"></div>

<script>
/* ---- 演示交互（复刻参考行为；新页面接入真实数据后替换）---- */
function toast(msg, type) {
  const el = document.createElement("div");
  el.className = "toast " + (type || "");
  el.textContent = msg;
  document.getElementById("toast-wrap").append(el);
  setTimeout(() => el.remove(), 2400);
}
/* 模式切换（编程套餐 / API Key） */
document.querySelectorAll(".mode-btn").forEach((b) => b.onclick = () => {
  document.querySelectorAll(".mode-btn").forEach((x) => x.classList.remove("active"));
  b.classList.add("active");
  document.getElementById("panel-package").classList.toggle("hidden", b.dataset.mode !== "package");
  document.getElementById("panel-api").classList.toggle("hidden", b.dataset.mode !== "api");
});
/* 供应商行选中（演示） */
document.querySelectorAll("[data-provider]").forEach((b) => b.onclick = () => {
  document.querySelectorAll(".mode-btn").forEach((x) => x.classList.remove("active"));
  document.getElementById("panel-package").classList.add("hidden");
  document.getElementById("panel-api").classList.remove("hidden");
  toast("已选中供应商「" + b.textContent.trim() + "」（模板演示）", "ok");
});
/* 账号下拉 */
const menu = document.getElementById("profile-menu");
document.getElementById("profile-btn").onclick = (e) => { e.stopPropagation(); menu.classList.toggle("hidden"); };
document.addEventListener("click", () => menu.classList.add("hidden"));
menu.querySelectorAll(".dropdown-item").forEach((b) =>
  b.onclick = () => { menu.classList.add("hidden"); toast("「" + b.textContent.trim() + "」稍后接入"); });
/* 开关 */
document.getElementById("mapping-switch").onclick = function () {
  this.classList.toggle("on");
  document.getElementById("mapping-rows").classList.toggle("hidden", !this.classList.contains("on"));
};
document.getElementById("toggle-provider").onclick = function () {
  this.textContent = this.textContent === "禁用" ? "启用" : "禁用";
  toast("供应商已" + (this.textContent === "禁用" ? "启用" : "禁用"), "ok");
};
/* 药丸 tab */
document.querySelectorAll(".pill-tab").forEach((b) => b.onclick = () => {
  b.parentElement.querySelectorAll(".pill-tab").forEach((x) => x.classList.remove("active"));
  b.classList.add("active");
});
/* API Key 显隐 */
document.getElementById("toggle-key").onclick = () => {
  const i = document.getElementById("apikey-input");
  i.value = i.value.startsWith("•") ? "mock-api-key-visible-for-preview" : "•••••••••••••••••••••••••••••••••••••••";
};
/* 行内编辑（供应商名 15px / 模型名 13px 两种规格） */
document.querySelectorAll("[data-edit],[data-edit-trigger]").forEach((b) => b.onclick = () => {
  const nameBtn = b.hasAttribute("data-edit") ? b : b.parentElement.querySelector("[data-edit]");
  if (!nameBtn || nameBtn.tagName === "INPUT") return;
  const isSm = nameBtn.classList.contains("sm");
  const row = nameBtn.closest(".list-row");
  if (row) row.classList.add("editing");
  const input = document.createElement("input");
  input.value = nameBtn.textContent;
  Object.assign(input.style, isSm
    ? { height: "32px", flex: "1", minWidth: "0", border: "none", outline: "none", background: "transparent",
        font: "700 13px -apple-system,'PingFang SC',sans-serif", color: "var(--text-soft)" }
    : { height: "32px", minWidth: "180px", maxWidth: "320px", border: "1px solid var(--text)",
        borderRadius: "10px", background: "var(--surface)", padding: "0 10px", outline: "none",
        font: "800 15px -apple-system,'PingFang SC',sans-serif", letterSpacing: "-.02em", color: "var(--text)" });
  nameBtn.replaceWith(input);
  input.focus(); input.select();
  const save = () => { nameBtn.textContent = input.value.trim() || nameBtn.textContent;
    input.replaceWith(nameBtn); if (row) row.classList.remove("editing");
    toast("已更新名称", "ok"); };
  input.onblur = save;
  input.onkeydown = (e) => { if (e.key === "Enter") save();
    if (e.key === "Escape") { input.replaceWith(nameBtn); if (row) row.classList.remove("editing"); } };
});
/* 演示按钮 */
document.getElementById("add-provider").onclick = () => toast("已添加供应商（模板演示）", "ok");
document.getElementById("add-model").onclick = () => toast("已添加模型（模板演示）", "ok");
document.getElementById("login-zai").onclick = () => toast("Z.AI 登录鉴权稍后接入");
document.getElementById("subscribe").onclick = () => toast("套餐订阅稍后接入");
/* ?theme=dark 暗色预览 */
if (location.search.includes("theme=dark")) document.documentElement.dataset.theme = "dark";
</script>
