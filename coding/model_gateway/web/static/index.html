<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Model-Gateway 管理界面</title>
<link rel="stylesheet" href="/css/base.css">
</head>
<body>

<!-- 应用壳（Q18-①：自用本地系统，管理端免鉴权，无令牌门；Q22 参考规范视觉：分组侧栏 + 两行顶栏） -->
<div id="app" class="app">
  <aside class="sidenav" id="sidenav">
    <div class="brand">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
             stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 17V7l8 10 8-10v10"/></svg>
      </span>
      <span class="brand-text">
        <span class="brand-name">Model-Gateway</span>
        <span class="brand-sub">LLM Gateway Console</span>
      </span>
    </div>
    <nav class="nav-list">
      <div class="nav-group">
        <div class="nav-group-title">概览</div>
        <a href="#/dashboard" data-page="dashboard" class="nav-item">
          <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"
               stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
          <span>总览</span></a>
      </div>
      <div class="nav-group">
        <div class="nav-group-title">资源配置</div>
        <a href="#/resources" data-page="resources" class="nav-item">
          <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"
               stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></svg>
          <span>接入模型资源</span></a>
        <a href="#/accounts" data-page="accounts" class="nav-item">
          <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"
               stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></svg>
          <span>接入账号资源</span></a>
        <a href="#/models" data-page="models" class="nav-item">
          <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"
               stroke-linecap="round" stroke-linejoin="round"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"/><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"/><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"/></svg>
          <span>网关模型管理</span></a>
      </div>
      <div class="nav-group">
        <div class="nav-group-title">运行观测</div>
        <a href="#/stats" data-page="stats" class="nav-item">
          <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"
               stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>
          <span>数据看板</span></a>
        <a href="#/logs" data-page="logs" class="nav-item">
          <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"
               stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h.01"/><path d="M3 12h.01"/><path d="M3 19h.01"/><path d="M8 5h13"/><path d="M8 12h13"/><path d="M8 19h13"/></svg>
          <span>请求日志</span></a>
      </div>
      <div class="nav-group">
        <div class="nav-group-title">系统设置</div>
        <a href="#/apiaccess" data-page="apiaccess" class="nav-item">
          <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"
               stroke-linecap="round" stroke-linejoin="round"><path d="m15.5 7.5 2.3 2.3a1 1 0 0 0 1.4 0l2.1-2.1a1 1 0 0 0 0-1.4L19 4"/><path d="m21 2-9.6 9.6"/><circle cx="7.5" cy="15.5" r="5.5"/></svg>
          <span>API 接入</span></a>
        <a href="#/settings" data-page="settings" class="nav-item">
          <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"
               stroke-linecap="round" stroke-linejoin="round"><path d="M10 8h4"/><path d="M12 21v-9"/><path d="M12 8V3"/><path d="M17 16h4"/><path d="M19 12V3"/><path d="M19 21v-5"/><path d="M3 14h4"/><path d="M5 10V3"/><path d="M5 21v-7"/></svg>
          <span>系统设置</span></a>
      </div>
      <div class="nav-group">
        <div class="nav-group-title">模板</div>
        <a href="#/templates" data-page="templates" class="nav-item">
          <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"
               stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="7" x="3" y="3" rx="1"/><rect width="9" height="7" x="3" y="14" rx="1"/><rect width="5" height="7" x="16" y="14" rx="1"/></svg>
          <span>模板页面</span></a>
      </div>
      <!-- 模板页面（2026-10-01 用户指示恢复单入口）：浏览与内嵌运行 web/static/templates/*.html
           参考模板库；清单与文件的双向一致由 tests/unit/test_v2_templates_page.py 钉住。 -->
    </nav>
  </aside>

  <div class="main-col">
    <header class="topbar">
      <button class="nav-toggle" id="nav-toggle" title="菜单">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16"/><path d="M4 12h16"/><path d="M4 19h16"/></svg>
      </button>
      <div class="tb-left">
        <div class="crumb">
          <span>Console</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
          <span id="crumb-group">概览</span>
        </div>
        <h1 class="tb-title" id="tb-title">总览</h1>
      </div>
      <div class="tb-right">
        <span class="tb-text mono tb-addr" id="tb-addr" title="调用地址"></span>
        <!-- 运营失败红点（v2.0 §21 / §16.6）：有未读 failed 时显示；数据源 /admin/api/status -->
        <button class="ops-dot" id="ops-dot" hidden title="运营任务有失败 · 点击确认（逐条原因见 data/usage/ops-results-*.jsonl）">
          <span class="ops-dot-mark"></span>
          <span class="ops-dot-text" id="ops-dot-text"></span>
        </button>
        <div class="theme-group" id="theme-group">
          <button class="icon-btn" data-theme-mode="light" title="浅色主题">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
          </button>
          <button class="icon-btn" data-theme-mode="dark" title="深色主题">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/></svg>
          </button>
          <button class="icon-btn" data-theme-mode="system" title="跟随系统">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></svg>
          </button>
        </div>
      </div>
    </header>

    <main class="content" id="content"></main>
  </div>
</div>

<div id="toast-wrap"></div>
<div id="modal-root"></div>

<script src="/js/vendor/chart.umd.js"></script>
<script type="module" src="/js/main.js"></script>
<script>
/* 装载兜底：模块图解析失败（如浏览器缓存新旧混载的 JS，import 的导出名不存在）
   会使 main.js 整体不执行——静态框架仍在而内容区永久空白。3s 未见到启动标记
   则在内容区给出可行动提示（2026-09-05 用户实测「只有框架内容空白」）。 */
window.__MG_BOOTED = false;
setTimeout(() => {
  if (window.__MG_BOOTED) return;
  const c = document.getElementById("content");
  if (c && !c.firstElementChild) c.innerHTML =
    '<div class="card center-card">' +
    '<h2 style="font-size:18px;margin-bottom:8px">界面脚本未能加载</h2>' +
    '<p style="color:var(--text-muted);font-size:13px;line-height:1.8">' +
    '通常是浏览器缓存了新旧混载的脚本文件。请强制刷新一次' +
    '（Mac：<b>Cmd+Shift+R</b> · Windows：<b>Ctrl+F5</b>）即可恢复。</p></div>';
}, 3000);
</script>
</body>
</html>
