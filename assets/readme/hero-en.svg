<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="t d">
  <title id="t">Model-Gateway</title>
  <desc id="d">Model-Gateway pools five provider resources into one local gateway node, which exposes a single OpenAI-compatible endpoint to Trae, Cursor and Cherry Studio.</desc>

  <rect x="0.5" y="0.5" width="1199" height="499" rx="24" fill="#f7f9fa" stroke="#e3e8ec"/>

  <g id="title-block" transform="translate(64 62)">
    <text x="0" y="0" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" letter-spacing="3" fill="#5c6470">LOCAL-FIRST LLM GATEWAY</text>
    <text x="0" y="58" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',PingFang SC,sans-serif" font-size="54" font-weight="700" fill="#171b22">Model-Gateway</text>
    <text x="0" y="96" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',PingFang SC,sans-serif" font-size="20" fill="#3c434d">One local endpoint for every LLM key you own — with automatic failover.</text>
  </g>

  <g id="pool-column">
    <text x="64" y="202" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" letter-spacing="2" fill="#5c6470">RESOURCE POOL</text>
    <g id="pool-card-1">
      <rect x="64" y="216" width="252" height="42" rx="10" fill="#ffffff" stroke="#e3e8ec"/>
      <circle cx="84" cy="237" r="4" fill="#188038"/>
      <text x="98" y="243" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',PingFang SC,sans-serif" font-size="17" fill="#171b22">SenseNova</text>
      <text x="300" y="242" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#5c6470">api</text>
    </g>
    <g id="pool-card-2">
      <rect x="64" y="267" width="252" height="42" rx="10" fill="#ffffff" stroke="#e3e8ec"/>
      <circle cx="84" cy="288" r="4" fill="#188038"/>
      <text x="98" y="294" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',PingFang SC,sans-serif" font-size="17" fill="#171b22">SenseNova</text>
      <text x="300" y="293" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#5c6470">plan</text>
    </g>
    <g id="pool-card-3">
      <rect x="64" y="318" width="252" height="42" rx="10" fill="#ffffff" stroke="#e3e8ec"/>
      <circle cx="84" cy="339" r="4" fill="#188038"/>
      <text x="98" y="345" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',PingFang SC,sans-serif" font-size="17" fill="#171b22">DeepSeek</text>
      <text x="300" y="344" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#5c6470">api</text>
    </g>
    <g id="pool-card-4">
      <rect x="64" y="369" width="252" height="42" rx="10" fill="#ffffff" stroke="#e3e8ec"/>
      <circle cx="84" cy="390" r="4" fill="#188038"/>
      <text x="98" y="396" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',PingFang SC,sans-serif" font-size="17" fill="#171b22">GLM</text>
      <text x="300" y="395" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#5c6470">api</text>
    </g>
    <g id="pool-card-5">
      <rect x="64" y="420" width="252" height="42" rx="10" fill="#ffffff" stroke="#e3e8ec"/>
      <circle cx="84" cy="441" r="4" fill="#188038"/>
      <text x="98" y="447" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',PingFang SC,sans-serif" font-size="17" fill="#171b22">Kimi</text>
      <text x="300" y="446" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#5c6470">api</text>
    </g>
  </g>

  <g id="pool-links" stroke="#9aa4b0" stroke-width="1.5">
    <line x1="316" y1="237" x2="430" y2="282"/>
    <line x1="316" y1="288" x2="430" y2="302"/>
    <line x1="316" y1="339" x2="430" y2="322"/>
    <line x1="316" y1="390" x2="430" y2="342"/>
    <line x1="316" y1="441" x2="430" y2="362"/>
  </g>

  <g id="gateway-node">
    <rect x="430" y="240" width="350" height="180" rx="14" fill="#171b22"/>
    <text x="605" y="290" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',PingFang SC,sans-serif" font-size="24" font-weight="700" fill="#ffffff">Model-Gateway</text>
    <line x1="470" y1="312" x2="740" y2="312" stroke="#3a414b" stroke-width="1"/>
    <text x="605" y="345" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#cbd5dd">x=2 active set · y=2 failover · m=3 retry</text>
    <text x="605" y="372" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#8b95a0">failover-continue · cooldown · cancel-passthrough</text>
    <text x="605" y="399" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#8b95a0">/v1/chat/completions · /v1/images/generations</text>
    <text x="605" y="417" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#8b95a0">/v1/messages · /v1/models</text>
  </g>

  <g id="tool-links" stroke="#9aa4b0" stroke-width="1.5">
    <line x1="780" y1="280" x2="880" y2="239"/>
    <line x1="780" y1="320" x2="880" y2="299"/>
    <line x1="780" y1="360" x2="880" y2="359"/>
  </g>
  <text x="605" y="228" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#5c6470">one OpenAI-compatible endpoint</text>

  <g id="tool-column">
    <text x="880" y="202" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" letter-spacing="2" fill="#5c6470">YOUR TOOLS</text>
    <g id="tool-card-1">
      <rect x="880" y="216" width="256" height="46" rx="10" fill="#ffffff" stroke="#e3e8ec"/>
      <text x="1008" y="245" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',PingFang SC,sans-serif" font-size="17" fill="#171b22">Trae</text>
    </g>
    <g id="tool-card-2">
      <rect x="880" y="276" width="256" height="46" rx="10" fill="#ffffff" stroke="#e3e8ec"/>
      <text x="1008" y="305" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',PingFang SC,sans-serif" font-size="17" fill="#171b22">Cursor</text>
    </g>
    <g id="tool-card-3">
      <rect x="880" y="336" width="256" height="46" rx="10" fill="#ffffff" stroke="#e3e8ec"/>
      <text x="1008" y="365" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',PingFang SC,sans-serif" font-size="17" fill="#171b22">Cherry Studio</text>
    </g>
    <text x="1008" y="446" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',PingFang SC,sans-serif" font-size="15" fill="#5c6470">…or any OpenAI-compatible client</text>
  </g>
</svg>
